<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Guides reset</title><p>Resetting the old City Guides installation…</p><script> (async()=>{try{if("serviceWorker" in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();}if("caches" in window){for(const k of await caches.keys())await caches.delete(k);}for(const k of Object.keys(localStorage)){if(k.toLowerCase().includes("cityguides"))localStorage.removeItem(k);} }finally{location.replace("./?city=la-rochelle&reset=030");}})();</script>
