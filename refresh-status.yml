name: Refresh city opening-status data

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Refresh official-source status
        run: python refresh_status.py
      - name: Commit status if changed
        run: |
          git config user.name "City Guides status bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Refresh live opening status"
          git push
